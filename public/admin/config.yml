backend:
  name: github
  repo: huahualiu223/ahua-web
  branch: master
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: content
    label: 网站内容
    files:
      - name: site
        label: 首页与关于
        file: public/content/site.json
        fields:
          - {name: name, label: 站名, widget: string}
          - {name: description, label: 首页简介, widget: text}
          - {name: about, label: 关于, widget: text}
          - {name: avatar, label: 头像, widget: image, required: false, choose_url: false}
          - {name: email, label: 公开邮箱, widget: string, required: false}
          - {name: instagram, label: Instagram 用户名, widget: string, required: false}
          - {name: wechatName, label: 公众号搜索名称, widget: string, required: false}
          - {name: wechatQr, label: 公众号二维码, widget: image, required: false, choose_url: false}
          - name: links
            label: 其他链接
            widget: list
            required: false
            fields:
              - {name: label, label: 显示名称, widget: string}
              - {name: url, label: HTTPS 链接, widget: string}
      - name: posts
        label: 文章
        file: public/content/posts.json
        fields:
          - name: posts
            label: 文章列表
            widget: list
            required: false
            fields:
              - {name: slug, label: 文章链接名, widget: string}
              - {name: title, label: 标题, widget: string}
              - name: kind
                label: 类型
                widget: select
                required: false
                default: article
                options:
                  - {label: 文章, value: article}
                  - {label: 随笔, value: note}
              - {name: date, label: 日期, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
              - {name: body, label: 正文, widget: text}
