<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人主页</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Instrument+Serif&amp;family=Inter:wght@400;600&amp;display=swap">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/site.js"></script>
</head>
<body>
<header><a class="brand" href="/">个人主页</a><nav aria-label="主导航"><a href="/#posts">文章</a><a href="/#about">关于</a></nav></header>
<main>
<section id="intro">
  <div class="portrait"><span id="initial" aria-hidden="true">个</span><img id="avatar" alt="个人头像" hidden><i aria-hidden="true"></i></div>
  <h1>个人主页</h1><p id="description"></p>
  <nav id="contacts" aria-label="联系方式" hidden></nav>
  <details id="wechat" hidden><summary>微信公众号</summary><p id="wechat-name"></p><img id="wechat-qr" alt="微信公众号二维码" hidden></details>
</section>
<section id="posts"><h2>文章</h2><ul id="post-list"></ul><p id="post-status" role="status"></p></section>
<section id="about"><h2>关于</h2><p id="bio"></p></section>
<article id="article" hidden><a href="/#posts">返回文章</a><h1></h1><time></time><div id="body"></div></article>
</main>
<footer><a href="/admin/">内容管理</a></footer>
</body>
</html>
