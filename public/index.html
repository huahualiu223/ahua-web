<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人主页</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/site.js"></script>
</head>
<body>
<header><a class="brand" href="/">个人主页</a><nav aria-label="主导航"><a href="/#posts">记录</a><a href="/?kind=project#posts">小玩意</a><a href="/?kind=activity#posts">活动</a><a href="/#about">关于</a></nav></header>
<main>
<section id="intro">
  <div class="portrait"><span id="initial" aria-hidden="true">个</span><img id="avatar" alt="个人头像" hidden><i aria-hidden="true"></i></div>
  <h1>个人主页</h1><p id="description"></p>
  <nav id="contacts" aria-label="联系方式" hidden></nav>
  <details id="wechat" hidden><summary>微信公众号</summary><p id="wechat-name"></p><img id="wechat-qr" alt="微信公众号二维码" hidden></details>
</section>
<section id="archive" aria-label="记录">
  <nav id="months" aria-label="按月份筛选" hidden></nav>
  <div id="posts">
    <h2>记录</h2>
    <nav id="kinds" aria-label="按类型筛选" hidden></nav>
    <div class="filter-summary"><p id="post-status" role="status"></p><button id="clear-filters" type="button" hidden>清除筛选</button></div><ul id="post-list"></ul>
  </div>
</section>
<section id="about"><h2>关于</h2><p id="bio"></p></section>
<article id="article" hidden><a id="back-to-records" href="/#posts">返回记录</a><h1></h1><time></time><div id="body"></div></article>
</main>
<footer><a href="/admin/">内容管理</a></footer>
</body>
</html>
